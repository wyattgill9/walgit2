syntax = "proto3";

package walgit.v1;

import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Repository layout under <prefix> = repos/<owner>/<repo>/
//
//   manifest.pb            tiny, CAS-rewritten: the linearization point
//   log/<seg:016x>.pb      LogSegment: entries [first_seq..=last_seq]
//                          zonal bucket: one appendable object per open segment
//                          regional bucket: immutable object per publish batch,
//                          later merged into K-entry segments by compaction
//   wal/<sha>.pack|.idx    immutable, content-addressed (pack checksum)
//                          (+ .rev, .bitmap for compacted packs)
//   checkpoints/<seq:016x>/checkpoint.pb   Checkpoint: pack set + ref snapshot ref
//   checkpoints/refs/<sha256>.pb          canonical RefSnapshot
//   checkpoints/forge/<sha256>.pb         ForgeHistory (D50)
//   checkpoints/<seq:016x>/attempts/<id>/checkpoint.pb  unique metadata candidate
//   Older checkpoints/<seq:016x>/refs.pb and bundle objects remain decodable;
//   bundle wrappers/lists are historical data, not active runtime delivery.
//   leases/<name>.pb       Lease (CAS + TTL)
//   lfs/objects/aa/bb/<oid>
//
// Packs/snapshots/logs are immutable; manifests, leases and documented control
// objects are mutable. Historical bundle formats below remain replayable.
// ---------------------------------------------------------------------------

message Manifest {
  // Format marker. New readers reject unknown values; deployed older readers
  // do not enforce this gate and must be excluded during authority cutovers.
  uint32 format_version = 1;
  // "<owner>/<repo>"
  string repo = 2;
  // "sha1" | "sha256"
  string object_format = 3;
  // Sequence number of the last committed entry (0 = empty repo).
  uint64 head_seq = 4;
  // Oldest entry still present in `log_segments` (entries below are folded
  // into `checkpoint`). min_seq == checkpoint.seq + 1 unless no checkpoint.
  uint64 min_seq = 5;
  // Latest checkpoint (may be absent for a young repo).
  CheckpointRef checkpoint = 6;
  // Log segments covering [min_seq, head_seq], ascending, contiguous,
  // non-overlapping. Kept short by merging segments during compaction.
  repeated LogSegmentRef log_segments = 7;
  // Denormalized live pack set after applying every entry <= `head_seq`
  // (checkpoint packs + packs of later PUSH entries − superseded). Sorted by
  // seq. Materialize = these packs + checkpoint refs + replay log > checkpoint.
  repeated PackRef packs = 8;
  google.protobuf.Timestamp updated_at = 9;
  // Instance id of the writer that produced this generation (diagnostics).
  string writer = 10;
  // Monotonic counter of successful manifest writes.
  uint64 revision = 11;
  // D24: per-repository settings (latest). Inline (not a pointer): every
  // refs-level sync must see the effective config without another GET; the
  // document is small (validated <= 16 KiB). History = SETTINGS log entries.
  RepoSettings settings = 12;
  // Exact committed download history; no time or count expiry.
  repeated RetiredPack retired_packs = 13;
  // D50: the next issue/PR number (0 = the forge was never used). Allocated by the publisher
  // under this CAS, one per `ForgeOpened`.
  uint64 forge_next_number = 14;
  // D51: who may read and write this repository (latest). Inline like `settings`: every
  // refs-level sync sees it without another GET. Absent = public, no collaborators.
  // History = ACCESS log entries.
  RepoAccess access = 15;
}

// D51: repository visibility. The zero value is public (an absent `RepoAccess`).
enum Visibility {
  VISIBILITY_PUBLIC = 0;
  // Any signed-in account on the host may read.
  VISIBILITY_INTERNAL = 1;
  // Only collaborators, the namespace owner and site admins.
  VISIBILITY_PRIVATE = 2;
}

// D51: a repository role, ordered: each includes the ones below it.
enum AccessRole {
  ACCESS_ROLE_NONE = 0;
  ACCESS_ROLE_READ = 1;
  ACCESS_ROLE_TRIAGE = 2;
  ACCESS_ROLE_WRITE = 3;
  ACCESS_ROLE_MAINTAIN = 4;
  ACCESS_ROLE_ADMIN = 5;
}

// D51: visibility and collaborators of one repository (whole-document replace).
message RepoAccess {
  Visibility visibility = 1;
  // Account `user_id` -> role.
  map<string, AccessRole> collaborators = 2;
  // Monotonic per-repo access revision (1 = first publish).
  uint64 revision = 3;
  // `user_id` of who published (empty for the repository's creation).
  string author = 4;
  google.protobuf.Timestamp updated_at = 5;
  string message = 6;
}

// D24: per-repository settings — a TOML document restricted to the sections a
// repository may override (maintenance, compaction, upstream, refs, packfile_uri); the
// effective configuration is the host's walgit.toml with this merged on top
// (`Config::with_settings`). Validated at publish; invalid settings are
// never published.
message RepoSettings {
  // TOML text of the overrides.
  string toml = 1;
  // Monotonic per-repo settings revision (1 = first publish).
  uint64 revision = 2;
  // Who published (principal or instance id).
  string author = 3;
  google.protobuf.Timestamp updated_at = 4;
  // Free-text reason (shown in history).
  string message = 5;
}

message LogSegmentRef {
  // Object key relative to repo prefix, e.g. "log/0000000000000042.pb".
  string key = 1;
  uint64 first_seq = 2;
  uint64 last_seq = 3;
  // Bytes at the time of the manifest write (appendable segments grow; readers
  // must read to EOF and tolerate a partial trailing frame).
  uint64 size = 4;
  // True once no more entries will be appended (regional: always true).
  bool sealed = 5;
}

// Body of a log object. Encoding on the wire is a sequence of length-prefixed
// frames (uvarint len + `LogEntry` bytes) so appendable objects can grow without
// rewriting; `LogSegment` is the in-memory/decoded form and the encoding used
// for sealed immutable segments written whole.
message LogSegment {
  repeated LogEntry entries = 1;
}

message PackRef {
  // Pack checksum (trailing SHA of the .pack), hex. Object key = wal/<checksum>.pack
  string checksum = 1;
  uint64 pack_size = 2;
  uint64 idx_size = 3;
  bool has_rev = 4;
  bool has_bitmap = 5;
  uint64 object_count = 6;
  // The entry that introduced this pack.
  uint64 seq = 7;
  // Compaction tier: 0 = fresh push pack, 1 = medium, 2 = base (checkpoint).
  uint32 tier = 8;
  // A commit-graph layer (git split commit-graph file) covering this pack's
  // commits is stored at wal/<checksum>.commit-graph. Written for tier-2 bases
  // so readers walk history without pack data.
  bool has_commit_graph = 9;
  // OBJECTS is an ordinary unsegmented pack. HISTORY can be an old redundant
  // accelerator derived from a live base, or authoritative non-blob segment
  // content. BLOBS segments hold blobs. The enum alone does not establish
  // ownership, retirement safety or URI eligibility. Preserve exact descriptors.
  PackKind kind = 10;
  // Producer/base provenance; not permission to discard authoritative content.
  string derived_from = 11;
  // Provenance only; never a substitute for exact group coverage.
  uint64 covers_seq = 12;
  google.protobuf.Timestamp published_at = 13;
  PackAudience audience = 14;
  string ref_policy = 15;
  repeated string pack_groups = 16;
  repeated PackGroupCoverage group_coverages = 17;
  string coverage_refs_key = 18;
}

enum PackKind {
  PACK_KIND_OBJECTS = 0;
  PACK_KIND_HISTORY = 1;
  PACK_KIND_BLOBS = 2;
}

// Scope classification only. These labels do not authorize access or prove closure.
enum PackAudience {
  PACK_AUDIENCE_UNSPECIFIED = 0;
  PACK_AUDIENCE_CODE = 1;
  PACK_AUDIENCE_META = 2;
  PACK_AUDIENCE_RETAINED = 3;
}

message RetiredPack {
  string checksum = 1;
  google.protobuf.Timestamp retired_at = 2;
  uint64 retired_seq = 3;
}

message PackGroupCoverage {
  string group = 1;
  string ref_policy = 2;
  uint64 covers_seq = 3;
  repeated string packs = 4;
  string refs_key = 5;
}

enum EntryKind {
  ENTRY_KIND_UNSPECIFIED = 0;
  // A push: zero or one pack + a ref transaction.
  ENTRY_KIND_PUSH = 1;
  // A repack: one new pack superseding `supersedes`; refs unchanged.
  ENTRY_KIND_COMPACT = 2;
  // A ref-only change (deletes, force-updates to existing objects, admin ops).
  ENTRY_KIND_REF_UPDATE = 3;
  // A checkpoint was written; `checkpoint` points at it. Packs unchanged.
  ENTRY_KIND_CHECKPOINT = 4;
  // D24: `settings` changed (the manifest carries the latest; this is history).
  ENTRY_KIND_SETTINGS = 5;
  // D50: forge events only (`forge`); refs and packs unchanged.
  ENTRY_KIND_FORGE = 6;
  // D51: account events (`account`), only in the account log (`system/accounts/`).
  ENTRY_KIND_ACCOUNT = 7;
  // D51: `access` changed (the manifest carries the latest; this is history).
  ENTRY_KIND_ACCESS = 8;
}

message LogEntry {
  uint64 seq = 1;
  EntryKind kind = 2;
  // Present for PUSH (when objects were pushed) and COMPACT.
  PackRef pack = 3;
  // Present for PUSH and `REF_UPDATE`.
  RefTransaction txn = 4;
  // COMPACT only: pack checksums removed from the live set by this entry.
  repeated string supersedes = 5;
  // CHECKPOINT only.
  CheckpointRef checkpoint = 6;
  google.protobuf.Timestamp created_at = 7;
  string writer = 8;
  // Free-form provenance (push-options, client agent, principal). Small.
  map<string, string> meta = 9;
  // `ENTRY_KIND_SETTINGS`: the settings as published at this seq.
  RepoSettings settings = 10;
  // D50: issue/PR changes. On FORGE entries, and on PUSH when a ref change and a forge change
  // must commit together (a merge).
  repeated ForgeEvent forge = 11;
  // D51: `ENTRY_KIND_ACCOUNT`: account changes, applied in order, all or none.
  repeated AccountEvent account = 12;
  // D51: `ENTRY_KIND_ACCESS`: the access document as published at this seq.
  RepoAccess access = 13;
}

// D50: one issue/PR change. Its time is the entry's `created_at`; a comment's id is
// `seq << 10 | index of the event in the entry`.
message ForgeEvent {
  // The item. Requests send 0 with `opened`; the publisher assigns the number.
  uint64 number = 1;
  // Principal that made the change (D51: the account's login, for display).
  string actor = 2;
  // D51: the account's `user_id`, stamped by the publisher; empty on events before D51.
  string actor_id = 3;
  oneof body {
    ForgeOpened opened = 10;
    ForgeComment comment = 11;
    ForgeEdit edit = 12;
    ForgeStateChange state = 13;
    ForgeSetChange labels = 14;
    ForgeSetChange assignees = 15;
    ForgeReview review = 16;
    ForgeMerged merged = 17;
    ForgeDraft draft = 18;
    // Repository-scoped (number 0): define, update or delete a label of the catalog.
    ForgeLabel label = 19;
  }
}

// A pull request becomes a draft, or ready for review.
message ForgeDraft {
  bool draft = 1;
}

// The label catalog. Deleting a label also takes it off every item.
message ForgeLabel {
  string name = 1;
  // "#rrggbb"
  string color = 2;
  string description = 3;
  bool deleted = 4;
}

// A pull request merged: rides on the PUSH entry that moves `base_ref` to `merge_commit_oid`.
message ForgeMerged {
  // "merge" | "squash" | "rebase"
  string method = 1;
  string merge_commit_oid = 2;
  // The tips merged: the base before the merge and the head.
  string base_oid = 3;
  string head_oid = 4;
}

// A pull request review; its line comments anchor to `commit_oid`.
message ForgeReview {
  // "approved" | "changes_requested" | "commented"
  string state = 1;
  string body = 2;
  // The head the review looked at.
  string commit_oid = 3;
  repeated ForgeLineComment comments = 4;
}

message ForgeLineComment {
  string path = 1;
  // "RIGHT" (a line of the head) | "LEFT" (a line of the merge base).
  string side = 2;
  uint32 line = 3;
  string body = 4;
}

enum ForgeKind {
  FORGE_KIND_UNSPECIFIED = 0;
  FORGE_KIND_ISSUE = 1;
  FORGE_KIND_PULL = 2;
}

message ForgeOpened {
  ForgeKind kind = 1;
  string title = 2;
  string body = 3;
  repeated string labels = 4;
  repeated string assignees = 5;
  // Pull requests: merge `head_ref` into `base_ref` (branch names), and both tips when opened.
  // While open, the PR's head is the branch's current tip.
  string base_ref = 6;
  string head_ref = 7;
  string base_oid = 8;
  string head_oid = 9;
  // Pull requests: opened as a draft (not mergeable until ready for review).
  bool draft = 10;
}

message ForgeComment {
  string body = 1;
}

// Edits the item (comment_id = 0) or one comment.
message ForgeEdit {
  uint64 comment_id = 1;
  oneof change {
    string title = 2;
    string body = 3;
    bool deleted = 4;
  }
}

message ForgeStateChange {
  bool closed = 1;
  // Closing: "completed" | "not_planned".
  string reason = 2;
  // Closing a pull request: both tips at that moment (what it shows from then on).
  string base_oid = 3;
  string head_oid = 4;
}

message ForgeSetChange {
  repeated string add = 1;
  repeated string remove = 2;
}

// checkpoints/forge/<sha256>.pb: every forge event up to `seq`, in WAL order. The fold of
// these records is the forge state at `seq`.
message ForgeHistory {
  uint64 seq = 1;
  repeated ForgeRecord records = 2;
}

message ForgeRecord {
  uint64 seq = 1;
  google.protobuf.Timestamp at = 2;
  repeated ForgeEvent events = 3;
}

// ---------------------------------------------------------------------------
// D51: the account log, a WAL of its own at `system/accounts/` (same manifest/log/checkpoint
// layout). Its fold is the user directory: users, identity links, minimal orgs and reserved
// namespaces. Every index is derived from these events.
// ---------------------------------------------------------------------------

message AccountEvent {
  oneof body {
    AccountGenesis genesis = 1;
    UserCreated user_created = 2;
    IdentityLinked identity_linked = 3;
    ProfileChanged profile_changed = 4;
    NamespaceReserved namespace_reserved = 5;
    OrgCreated org_created = 6;
    OrgOwnersChanged org_owners_changed = 7;
    PasswordSet password_set = 8;
  }
}

// D52: a password account's credential: an Argon2id PHC string (salted, memory-hard). The log keeps
// every entry, so an old hash outlives a password change: changing it limits what a stolen
// *current* hash opens, not what a copy of the bucket's history holds. Empty `phc` = no password.
message PasswordSet {
  string user_id = 1;
  string phc = 2;
}

// The log's first event: the namespaces that held repositories when accounts began. They
// are reserved: sign-up can never take them, only an org created by a site admin can.
message AccountGenesis {
  repeated string reserved = 1;
}

message UserCreated {
  // Immutable, never reused (uuid v4).
  string user_id = 1;
  // The `<owner>` namespace. Unique across users, orgs and reserved namespaces.
  string login = 2;
  string email = 3;
  string name = 4;
  string avatar_url = 5;
}

// A sign-in identity that resolves to `user_id`. `(issuer, subject)` is unique.
message IdentityLinked {
  string user_id = 1;
  string issuer = 2;
  string subject = 3;
}

// Profile attributes; an empty field is unchanged.
message ProfileChanged {
  string user_id = 1;
  string email = 2;
  string name = 3;
  string avatar_url = 4;
}

// A namespace that holds repositories but has no account.
message NamespaceReserved {
  string login = 1;
}

// A minimal org: a namespace whose owners administer its repositories.
message OrgCreated {
  string org_id = 1;
  string login = 2;
  // `user_id`s.
  repeated string owners = 3;
}

message OrgOwnersChanged {
  string org_id = 1;
  repeated string owners = 2;
}

// checkpoints/accounts/<sha256>.pb: every account record up to `seq`, in WAL order.
message AccountHistory {
  uint64 seq = 1;
  repeated AccountRecord records = 2;
}

message AccountRecord {
  uint64 seq = 1;
  google.protobuf.Timestamp at = 2;
  repeated AccountEvent events = 3;
}

message RefUpdate {
  // Full ref name, e.g. "refs/heads/main" or "HEAD" (symbolic target update).
  string name = 1;
  // Hex object ids; all-zero id means "does not exist".
  string old_oid = 2;
  string new_oid = 3;
  // For symbolic refs (HEAD): the target ref name; oids are then empty.
  string new_symbolic_target = 4;
  // For refs/tags/* pointing at an annotated tag: the peeled commit (hex),
  // recorded by the writer so replicas can advertise `^{}` without objects.
  string new_peeled = 5;
}

message RefTransaction {
  repeated RefUpdate updates = 1;
  repeated string push_options = 2;
  // Recorded client intent (git push --atomic). WAL application is always atomic.
  bool atomic = 3;
}

// checkpoints/<seq>/checkpoint.pb
message Checkpoint {
  uint64 seq = 1;
  string object_format = 2;
  // Packs that fully represent the repository at `seq` (typically 1 base pack
  // (+ 1 medium)). Keys are wal/<checksum>.pack.
  repeated PackRef packs = 3;
  // Key of the `RefSnapshot`, e.g. "checkpoints/<seq>/refs.pb".
  string refs_key = 4;
  uint64 ref_count = 5;
  // Historical optional wrapper; retained for replay, new writers leave empty.
  string bundle_key = 6;
  google.protobuf.Timestamp created_at = 7;
  string writer = 8;
}

message CheckpointRef {
  uint64 seq = 1;
  // "checkpoints/<seq:016x>/checkpoint.pb"
  string key = 2;
  // When the checkpoint was written (drives the time-based trigger without
  // fetching the checkpoint object).
  google.protobuf.Timestamp created_at = 3;
  // Earliest WAL state this repository ever had (carried forward from the
  // previous checkpoint, else the first folded entry's `created_at`).
  // Historical provenance, retained independently of removed bundle schedules.
  google.protobuf.Timestamp first_state_at = 4;
  // `created_at` of the newest entry this checkpoint folded: the state it holds
  // is the repository "as of" this instant (≠ `created_at`, the write time).
  google.protobuf.Timestamp as_of = 5;
  // Exact committed snapshot pointer, empty on old checkpoints.
  string refs_key = 6;
  // D50: the `ForgeHistory` at `seq`; empty when the forge was never used.
  string forge_key = 7;
  // D51: the `AccountHistory` at `seq`; only on the account log.
  string accounts_key = 8;
}

message RefSnapshot {
  uint64 seq = 1;
  string object_format = 2;
  // Sorted by name, no duplicates.
  repeated Ref refs = 3;
  // Symbolic target of HEAD, e.g. "refs/heads/main".
  string head_target = 4;
  google.protobuf.Timestamp created_at = 5;
}

message Ref {
  string name = 1;
  string oid = 2;
  // Peeled tag target if `name` points to an annotated tag (hex), else empty.
  string peeled = 3;
}

// ---------------------------------------------------------------------------
// Coordination primitives: leases/<name>.pb
// ---------------------------------------------------------------------------

message Lease {
  string holder = 1;
  string purpose = 2;
  google.protobuf.Timestamp acquired_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  // Incremented on every heartbeat.
  uint64 epoch = 5;
}

// ---------------------------------------------------------------------------
// Historical bundle-uri formats: retained for decoding; no active runtime
// ---------------------------------------------------------------------------

message BundleList {
  // "all" | "any" (git bundle.mode)
  string mode = 1;
  // "creationToken"
  string heuristic = 2;
  repeated BundleEntry bundles = 3;
  google.protobuf.Timestamp updated_at = 4;
  // Closed slots measured and NOT cut (too small / no state as of the slot):
  // final for (strategy, slot, `base_id`) — every host and every restart skips
  // them in O(1) instead of re-measuring (a unit's worth of work each; after
  // a restart the SSD host re-walked ~30 of them before reaching the live slot,
  // 2026-08-21). A new base bundle for the slot re-opens the question.
  repeated SkippedSlot skipped = 5;
}

message SkippedSlot {
  string strategy = 1;
  uint64 slot = 2;
  // The base bundle the measurement was against ("" for a full / no-state).
  string base_id = 3;
  // WAL seq the slot resolved to when measured (0 = no state).
  uint64 as_of_seq = 4;
  // "too-small: N commits (min M)" | "no state as of the slot"
  string reason = 5;
  google.protobuf.Timestamp at = 6;
}

message BundleEntry {
  // Stable id used in `bundle.<id>.uri`.
  string id = 1;
  // Object key relative to repo prefix.
  string key = 2;
  string strategy = 3;
  // "full" | "incremental"
  string kind = 4;
  // Monotonic; git downloads bundles with creationToken > what it has.
  uint64 creation_token = 5;
  // WAL seq the bundle was created from.
  uint64 seq = 6;
  uint64 size = 7;
  // Id of the bundle this incremental one is based on (empty for full).
  string base_id = 8;
  google.protobuf.Timestamp created_at = 9;
  // Object store version tag (ETag/generation) at upload; used for HTTP `ETag`.
  string version = 10;
  // Ref tips the bundle contains (refs/heads/*, refs/tags/*, HEAD). For
  // incremental bundles, the base bundle's tips are the prerequisites.
  repeated Ref tips = 11;
  // Calendar slot this bundle was cut for (epoch seconds of the schedule
  // fire time); `creation_token` equals it. Content = ref state at the WAL
  // seq as of the slot (`seq`), not "now" — a backfilled Tuesday bundle is
  // Tuesday's main. 0 for bundles built before slots existed.
  uint64 slot = 12;
  // Object filter of the bundle's pack ("" = none, "blob:none" = the blobless
  // family): advertised as `bundle.<id>.filter` at `bundles/list?filter=…`
  // and never in the unfiltered list.
  string filter = 13;
}

// Result of the last connectivity audit of a repository: repos/<o>/<r>/fsck.pb.
// Written by the maintainer's `fsck` unit (git fsck --connectivity-only over a
// complete local copy), consumed by the `repair` unit (fetch `missing` from
// upstream.git, publish as a pack) and by `walgit_repo_missing_objects{repo}`.
// Not WAL state: overwritten, never replayed.
message FsckReport {
  // WAL seq the audited copy had applied.
  uint64 seq = 1;
  google.protobuf.Timestamp at = 2;
  string host = 3;
  // Objects reachable from refs that are in no live pack (bounded list).
  repeated string missing = 4;
  uint64 missing_total = 5;
  // Other fsck problems (corrupt objects etc.), count only.
  uint64 problems = 6;
  double elapsed_secs = 7;
  // Set by the repair unit: the seq whose COMPACT entry brought `missing` back.
  uint64 repaired_seq = 8;
}

// Optional catalog: meta/repos.pb (CAS). Not required for correctness.
message RepoCatalog {
  repeated string repos = 1;
  google.protobuf.Timestamp updated_at = 2;
}

// Maintainer heartbeat at `maintain/<host>.pb` (bucket root, not per repo):
// who maintains what, with what capacity, and whether that host is alive.
// The WAL page shows the responsible host per repository.
message MaintainerHeartbeat {
  string host = 1;
  repeated string repos = 2;
  repeated string exclude = 3;
  uint64 max_pack_bytes = 4;
  string disk = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp last_pass_at = 7;
  // Last unit done: "<repo> <kind> <detail>".
  string last_unit = 8;
  uint64 passes = 9;
}
